    <script src="script.js"></script>
        <script>
   const scriptURL = 'https://script.google.com/macros/s/AKfycbxNY0LoxjXVNZStL4a8atzqRvDyFWzM-o7adlRH_vmaXhZ2qg6QcL13hD5wHPS_2lFjxA/exec';

const form = document.forms['submit-to-google-sheet'];
const msg = document.getElementById('msg');

form.addEventListener('submit', async (e) => {
    e.preventDefault();

    // Show immediately after clicking Submit
    msg.innerHTML = 'Sending...';
    msg.style.color = '#fff';

    // Disable button while sending
    const submitButton = form.querySelector('button[type="submit"]');
    submitButton.disabled = true;
    submitButton.innerHTML = 'Sending...';

    try {
        const response = await fetch(scriptURL, {
            method: 'POST',
            body: new FormData(form)
        });

        if (response.ok) {
            msg.innerHTML = 'Message sent successfully!';
            msg.style.color = '#61b752';

            // Clear form
            form.reset();

            // Remove success message after 5 seconds
            setTimeout(() => {
                msg.innerHTML = '';
            }, 5000);

        } else {
            msg.innerHTML = 'Something went wrong. Please try again.';
            msg.style.color = '#ff6b6b';
        }

    } catch (error) {
        console.error('Error!', error);

        msg.innerHTML = 'Unable to send message. Please try again.';
        msg.style.color = '#ff6b6b';

    } finally {
        // Enable button again
        submitButton.disabled = false;
        submitButton.innerHTML = 'Submit';
    }
});
    </script>
